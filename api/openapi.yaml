openapi: 3.1.0
info:
  contact:
    email: support@docustay.app
    name: Docustay support
    url: https://docustay.app/contact
  description: |-
    Send documents for signature and follow them, from your own software.

    **Authentication.** Send `Authorization: Bearer <key>`. Make keys in Settings → Developers → API keys and give each only the scopes it needs (there are 12 in all): `documents:read`, `documents:write`, `people:read`, `plays:read`, `plays:write`, `drafts:write`, `templates:read`, `templates:write`, `webhooks:read`, `webhooks:write`, `account:read`, `embedded:write`. A key that starts `dsk_test_` works in **test mode**: documents it sends are practice runs (emailed only to the sender, stamped TEST, never counted or billed), it can only see and act on test documents (any other document answers `404`), and it can sign them itself with `POST /api/v1/documents/{id}/test-sign`. A key can also be limited to a list of addresses, given an expiry, or made **draft-only**.

    **Draft-only keys.** A draft-only key can make and edit drafts but cannot send. Asking it to send answers `202` with an `approval`, the document stays a draft, and a person approves or declines in Settings → Developers → Approvals. Keys can also have a daily limit of drafts and sends; past it you get `429`.

    **Payments.** A template may contain payment fields (text tag `type=payment` with a set `amount`, optionally a `deposit`, or an amount you give when you send it with `amount=custom.<name>`). The signer pays on Stripe's hosted page; the money goes to your own connected Stripe account; Docustay's fee is 2% on the Free plan and 0% on Pro, plus Stripe's own fees. The document's `payments` list shows each payment, its receipt and the fee. Card details never reach Docustay.

    **Idempotency.** Requests that create a document or a template, or send one, need an `Idempotency-Key` header (8–200 characters). Repeating a request with the same key and body returns the first answer instead of doing it twice.

    **Your own reference.** Documents and templates take `externalId` (your id for it) and `metadata` (up to 20 short key/value pairs). List with `externalId=` or `metadata[key]=value` to find them again, and both come back in webhooks.

    **Errors.** Every error is `{ "error": { "kind", "message", "requestId", "retryable" } }`. `kind` is one of `invalid`, `unauthenticated`, `forbidden`, `not_found`, `conflict`, `rate_limited`, `dependency`, `timeout`. Quote the `requestId` to support, or search it in Settings → Developers → API log. **Plan limits** are `403 forbidden` with `error.detail.code`: `plan_document_limit` (the plan's documents this month are used) or `plan_template_limit` (Free: 5 new templates a month; a new version of a template you have does not count). Both carry `detail.used`, `detail.limit` and `detail.resetsAt` (the first of next month, UTC). Everything already made keeps working. Pro and self-hosted installs have no template limit.

    **Rate limits.** Each key has its own per-minute budget. Every answer carries `RateLimit-Limit`, `RateLimit-Remaining` and `RateLimit-Reset` (seconds); over the budget you get `429` with a `Retry-After` header.

    **Versions.** Every answer carries `Docustay-Version`, a date. A change that could break a caller gets a new date and is announced in the changelog before it ships; additions (a new field, a new route) are not breaking and do not change the date.

    **Pagination.** Lists take `limit` (1–200) and `cursor`; the answer carries `page.nextCursor` (null on the last page).

    **Signing links.** No response contains a signing link or access code, with one exception you control: a seat you send in `embedded` can be given an embedded signing session (`POST /api/v1/documents/{id}/embed-session`), a one-hour link for a frame on a website you listed. A key can start and follow a signature, and put your own signer in front of the form for seats you marked yourself; it cannot sign for anyone.
  license:
    name: AGPL-3.0-or-later (server); the SDKs are MIT. The hosted API is used under
      the Terms.
    url: https://docustay.app/docs/licensing
  termsOfService: https://docustay.app/legal/terms
  title: Docustay API
  version: 2026-10-07
  x-api-version: 2026-10-07
servers:
- description: Docustay (hosted) or your own install
  url: "https://{host}"
  variables:
    host:
      default: app.docustay.app
      description: app.docustay.app for the hosted service; your own address when
        you self-host.
security:
- bearerAuth: []
tags:
- description: "Make a document, send it to people to sign and follow it to the signed\
    \ copy."
  name: Documents
- description: "Reusable documents with seats for the people who fill them. Make one\
    \ from HTML, a file or words, then send it again and again."
  name: Templates
- description: "What the emails about your documents say, and the log of what was\
    \ sent and what happened to it."
  name: Email
- description: Counts of what was sent and completed.
  name: Reports
- description: Teams and their members.
  name: Teams
- description: "Your plan, your usage and whether payments are ready."
  name: Account
- description: "Where Docustay tells your software that something happened. Add an\
    \ address (or a relay to your own computer), test it, rotate its secret."
  name: Webhooks
- description: Rules your assistant follows when it starts a document (Pro).
  name: Plays
paths:
  /api/v1/documents/templates:
    get:
      operationId: listTemplates
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/listTemplates_200_response'
          description: "Approved, current templates."
          headers:
            Docustay-Version:
              $ref: '#/components/headers/Docustay-Version'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
        "400":
          content:
            application/json:
              example:
                error:
                  kind: validation
                  message: "parties[0].email is not a valid address"
                  retryable: false
              schema:
                $ref: '#/components/schemas/Error'
          description: The request is not valid. `message` says which field and why.
        "401":
          content:
            application/json:
              example:
                error:
                  kind: unauthenticated
                  message: the API token is not valid
                  retryable: false
              schema:
                $ref: '#/components/schemas/Error'
          description: "The key is missing, wrong, revoked, or lacks the scope. Every\
            \ credential failure gets this same answer."
        "403":
          content:
            application/json:
              example:
                error:
                  kind: forbidden
                  message: this key is not permitted
                  retryable: false
              schema:
                $ref: '#/components/schemas/Error'
          description: "The key is valid but not allowed to do this (a plan limit,\
            \ or the action is not permitted for keys)."
        "429":
          content:
            application/json:
              example:
                error:
                  kind: rate_limited
                  message: rate limit exceeded for this API key
                  retryable: true
              schema:
                $ref: '#/components/schemas/Error'
          description: "Too many requests. Wait `Retry-After` seconds, then try again."
      security:
      - bearerAuth: []
      summary: Templates you can send
      tags:
      - Documents
      x-codeSamples:
      - lang: curl
        label: curl
        source: |-
          curl -X GET "https://app.docustay.app/api/v1/documents/templates" \
            -H "Authorization: Bearer $DOCUSTAY_API_KEY" \
            -H "Accept: application/json"
      - lang: JavaScript
        label: JavaScript (SDK)
        source: |-
          import { Docustay } from "@docustay2026/sdk";

          const docustay = new Docustay(process.env.DOCUSTAY_API_KEY);
          const result = await docustay.listTemplates();
          console.log(result);
      - lang: Python
        label: Python (requests)
        source: |-
          import os, requests

          r = requests.get(
              f"https://app.docustay.app/api/v1/documents/templates",
              headers={"Authorization": f"Bearer {os.environ['DOCUSTAY_API_KEY']}"},
          )
          r.raise_for_status()
          print(r.json())
  /api/v1/documents:
    get:
      description: "Filter by your own reference: `externalId=…`, and `metadata[key]=value`\
        \ (repeat for more keys; a document must match all)."
      operationId: listDocuments
      parameters:
      - explode: true
        in: query
        name: state
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: limit
        required: false
        schema:
          maximum: 200
          minimum: 1
          type: integer
        style: form
      - explode: true
        in: query
        name: cursor
        required: false
        schema:
          type: string
        style: form
      - description: Only documents with this `externalId`.
        explode: true
        in: query
        name: externalId
        required: false
        schema:
          description: Only documents with this `externalId`.
          maxLength: 200
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/listDocuments_200_response'
          description: "A page of documents, newest first."
          headers:
            Docustay-Version:
              $ref: '#/components/headers/Docustay-Version'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
        "400":
          content:
            application/json:
              example:
                error:
                  kind: validation
                  message: "parties[0].email is not a valid address"
                  retryable: false
              schema:
                $ref: '#/components/schemas/Error'
          description: The request is not valid. `message` says which field and why.
        "401":
          content:
            application/json:
              example:
                error:
                  kind: unauthenticated
                  message: the API token is not valid
                  retryable: false
              schema:
                $ref: '#/components/schemas/Error'
          description: "The key is missing, wrong, revoked, or lacks the scope. Every\
            \ credential failure gets this same answer."
        "403":
          content:
            application/json:
              example:
                error:
                  kind: forbidden
                  message: this key is not permitted
                  retryable: false
              schema:
                $ref: '#/components/schemas/Error'
          description: "The key is valid but not allowed to do this (a plan limit,\
            \ or the action is not permitted for keys)."
        "429":
          content:
            application/json:
              example:
                error:
                  kind: rate_limited
                  message: rate limit exceeded for this API key
                  retryable: true
              schema:
                $ref: '#/components/schemas/Error'
          description: "Too many requests. Wait `Retry-After` seconds, then try again."
      security:
      - bearerAuth: []
      summary: List documents
      tags:
      - Documents
      x-codeSamples:
      - lang: curl
        label: curl
        source: |-
          curl -X GET "https://app.docustay.app/api/v1/documents" \
            -H "Authorization: Bearer $DOCUSTAY_API_KEY" \
            -H "Accept: application/json"
      - lang: JavaScript
        label: JavaScript (SDK)
        source: |-
          import { Docustay } from "@docustay2026/sdk";

          const docustay = new Docustay(process.env.DOCUSTAY_API_KEY);
          const result = await docustay.listDocuments();
          console.log(result);
      - lang: Python
        label: Python (requests)
        source: |-
          import os, requests

          r = requests.get(
              f"https://app.docustay.app/api/v1/documents",
              headers={"Authorization": f"Bearer {os.environ['DOCUSTAY_API_KEY']}"},
          )
          r.raise_for_status()
          print(r.json())
    post:
      description: "People first: each person has a name, an email and (optionally)\
        \ a role word from the text. The document is left as a **draft** unless `sendNow`\
        \ is true. Needs an `Idempotency-Key`."
      operationId: createDocument
      parameters:
      - description: "A unique value for this request (8–200 characters, for example\
          \ a UUID). Repeating the request with the same key and body returns the\
          \ first answer instead of doing it twice."
        explode: false
        in: header
        name: Idempotency-Key
        required: true
        schema:
          maxLength: 200
          minLength: 8
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDocumentRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentMade'
          description: The document.
          headers:
            Docustay-Version:
              $ref: '#/components/headers/Docustay-Version'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
        "400":
          content:
            application/json:
              example:
                error:
                  kind: validation
                  message: "parties[0].email is not a valid address"
                  retryable: false
              schema:
                $ref: '#/components/schemas/Error'
          description: The request is not valid. `message` says which field and why.
        "401":
          content:
            application/json:
              example:
                error:
                  kind: unauthenticated
                  message: the API token is not valid
                  retryable: false
              schema:
                $ref: '#/components/schemas/Error'
          description: "The key is missing, wrong, revoked, or lacks the scope. Every\
            \ credential failure gets this same answer."
        "403":
          content:
            application/json:
              example:
                error:
                  kind: forbidden
                  message: this key is not permitted
                  retryable: false
              schema:
                $ref: '#/components/schemas/Error'
          description: "The key is valid but not allowed to do this (a plan limit,\
            \ or the action is not permitted for keys)."
        "429":
          content:
            application/json:
              example:
                error:
                  kind: rate_limited
                  message: rate limit exceeded for this API key
                  retryable: true
              schema:
                $ref: '#/components/schemas/Error'
          description: "Too many requests. Wait `Retry-After` seconds, then try again."
      security:
      - bearerAuth: []
      summary: Make a document from words and people
      tags:
      - Documents
      x-codeSamples:
      - lang: curl
        label: curl
        source: |-
          curl -X POST "https://app.docustay.app/api/v1/documents" \
            -H "Authorization: Bearer $DOCUSTAY_API_KEY" \
            -H "Idempotency-Key: $(uuidgen)" \
            -H "Content-Type: application/json" \
            -d '{"email":{"subject":"string","message":"string","replyTo":"person@example.com","senderName":"string"},"metadata":{"crmDealId":"D-1042"},"externalId":"contract-2026-0042","title":"string","source":{},"people":[{"externalId":"contract-2026-0042","metadata":{"crmDealId":"D-1042"},"name":"string","email":"person@example.com","role":"string","action":"signer","order":1}],"facts":{},"variableValues":{},"paper":"letter","send":{"replyTo":"person@example.com","senderName":"string","subject":"string","message":"string","expiryDays":0,"reminderDays":[1],"signingOrder":"any","internalNote":"string","requireDeclineReason":false},"description":"string","sendNow":false}'
      - lang: JavaScript
        label: JavaScript (SDK)
        source: |-
          import { Docustay } from "@docustay2026/sdk";

          const docustay = new Docustay(process.env.DOCUSTAY_API_KEY);
          const result = await docustay.createDocument({"email":{"subject":"string","message":"string","replyTo":"person@example.com","senderName":"string"},"metadata":{"crmDealId":"D-1042"},"externalId":"contract-2026-0042","title":"string","source":{},"people":[{"externalId":"contract-2026-0042","metadata":{"crmDealId":"D-1042"},"name":"string","email":"person@example.com","role":"string","action":"signer","order":1}],"facts":{},"variableValues":{},"paper":"letter","send":{"replyTo":"person@example.com","senderName":"string","subject":"string","message":"string","expiryDays":0,"reminderDays":[1],"signingOrder":"any","internalNote":"string","requireDeclineReason":false},"description":"string","sendNow":false});
          console.log(result);
      - lang: Python
        label: Python (requests)
        source: |-
          import os, requests

          r = requests.post(
              f"https://app.docustay.app/api/v1/documents",
              headers={"Authorization": f"Bearer {os.environ['DOCUSTAY_API_KEY']}", "Idempotency-Key": __import__("uuid").uuid4().hex},
              json={"email":{"subject":"string","message":"string","replyTo":"person@example.com","senderName":"string"},"metadata":{"crmDealId":"D-1042"},"externalId":"contract-2026-0042","title":"string","source":{},"people":[{"externalId":"contract-2026-0042","metadata":{"crmDealId":"D-1042"},"name":"string","email":"person@example.com","role":"string","action":"signer","order":1}],"facts":{},"variableValues":{},"paper":"letter","send":{"replyTo":"person@example.com","senderName":"string","subject":"string","message":"string","expiryDays":0,"reminderDays":[1],"signingOrder":"any","internalNote":"string","requireDeclineReason":false},"description":"string","sendNow":false},
          )
          r.raise_for_status()
          print(r.json())
  /api/v1/documents/{id}:
    get:
      operationId: getDocument
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          example: 6f1c1f0e-7a0c-4d1d-9b5e-2f0a7b1c3d4e
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
          description: The document.
          headers:
            Docustay-Version:
              $ref: '#/components/headers/Docustay-Version'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
        "400":
          content:
            application/json:
              example:
                error:
                  kind: validation
                  message: "parties[0].email is not a valid address"
                  retryable: false
              schema:
                $ref: '#/components/schemas/Error'
          description: The request is not valid. `message` says which field and why.
        "401":
          content:
            application/json:
              example:
                error:
                  kind: unauthenticated
                  message: the API token is not valid
                  retryable: false
              schema:
                $ref: '#/components/schemas/Error'
          description: "The key is missing, wrong, revoked, or lacks the scope. Every\
            \ credential failure gets this same answer."
        "403":
          content:
            application/json:
              example:
                error:
                  kind: forbidden
                  message: this key is not permitted
                  retryable: false
              schema:
                $ref: '#/components/schemas/Error'
          description: "The key is valid but not allowed to do this (a plan limit,\
            \ or the action is not permitted for keys)."
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No such document.
        "429":
          content:
            application/json:
              example:
                error:
                  kind: rate_limited
                  message: rate limit exceeded for this API key
                  retryable: true
              schema:
                $ref: '#/components/schemas/Error'
          description: "Too many requests. Wait `Retry-After` seconds, then try again."
      security:
      - bearerAuth: []
      summary: One document and where each person is
      tags:
      - Documents
      x-codeSamples:
      - lang: curl
        label: curl
        source: |-
          curl -X GET "https://app.docustay.app/api/v1/documents/{id}" \
            -H "Authorization: Bearer $DOCUSTAY_API_KEY" \
            -H "Accept: application/json"
      - lang: JavaScript
        label: JavaScript (SDK)
        source: |-
          import { Docustay } from "@docustay2026/sdk";

          const docustay = new Docustay(process.env.DOCUSTAY_API_KEY);
          const result = await docustay.getDocument("6f1c1f0e-7a0c-4d1d-9b5e-2f0a7b1c3d4e");
          console.log(result);
      - lang: Python
        label: Python (requests)
        source: |-
          import os, requests

          r = requests.get(
              f"https://app.docustay.app/api/v1/documents/{id}",
              headers={"Authorization": f"Bearer {os.environ['DOCUSTAY_API_KEY']}"},
          )
          r.raise_for_status()
          print(r.json())
  /api/v1/documents/{id}/signed.pdf:
