  /api/v1/payments/{id}/refund:
    post:
      description: "Refunds through Stripe on the workspace's own account. Leave out\
        \ `amountMinor` for the rest of the payment. `reason` is required: it shows\
        \ on the payer's Stripe receipt and goes in the document's audit trail. The\
        \ signed document stays signed. Needs an `Idempotency-Key`."
      operationId: refundPayment
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - description: "A unique value for this request (8–200 characters, for example\
          \ a UUID). Repeating the request with the same key and body returns the\
          \ first answer instead of doing it twice."
        explode: false
        in: header
        name: Idempotency-Key
        required: true
        schema:
          maxLength: 200
          minLength: 8
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/refundPayment_request'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema: {}
          description: "Refund a payment, in full or in part"
          headers:
            Docustay-Version:
              $ref: '#/components/headers/Docustay-Version'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
        "400":
          content:
            application/json:
              example:
                error:
                  kind: validation
                  message: "parties[0].email is not a valid address"
                  retryable: false
              schema:
                $ref: '#/components/schemas/Error'
          description: The request is not valid. `message` says which field and why.
        "401":
          content:
            application/json:
              example:
                error:
                  kind: unauthenticated
                  message: the API token is not valid
                  retryable: false
              schema:
                $ref: '#/components/schemas/Error'
          description: "The key is missing, wrong, revoked, or lacks the scope. Every\
            \ credential failure gets this same answer."
        "403":
          content:
            application/json:
              example:
                error:
                  kind: forbidden
                  message: this key is not permitted
                  retryable: false
              schema:
                $ref: '#/components/schemas/Error'
          description: "The key is valid but not allowed to do this (a plan limit,\
            \ or the action is not permitted for keys)."
        "404":
          content:
            application/json:
              example:
                error:
                  kind: validation
                  message: "parties[0].email is not a valid address"
                  retryable: false
              schema:
                $ref: '#/components/schemas/Error'
          description: "Not found: nothing with that id or name in this workspace\
            \ (something in another workspace answers exactly the same)."
        "409":
          content:
            application/json:
              example:
                error:
                  kind: conflict
                  message: "The payment was never completed, or has already been refunded,\
                    \ so there is nothing (more) to refund."
                  retryable: false
              schema:
                $ref: '#/components/schemas/Error'
          description: "The payment was never completed, or has already been refunded,\
            \ so there is nothing (more) to refund."
        "429":
          content:
            application/json:
              example:
                error:
                  kind: rate_limited
                  message: rate limit exceeded for this API key
                  retryable: true
              schema:
                $ref: '#/components/schemas/Error'
          description: "Too many requests. Wait `Retry-After` seconds, then try again."
      security:
      - bearerAuth: []
      summary: "Refund a payment, in full or in part"
      tags:
      - Payments
      x-codeSamples:
      - lang: curl
        label: curl
        source: |-
          curl -X POST "https://app.docustay.app/api/v1/payments/{id}/refund" \
            -H "Authorization: Bearer $DOCUSTAY_API_KEY" \
            -H "Idempotency-Key: $(uuidgen)" \
            -H "Content-Type: application/json" \
            -d '{"amountMinor":1,"reason":"string"}'
      - lang: JavaScript
        label: JavaScript (SDK)
        source: |-
          import { Docustay } from "@docustay2026/sdk";

          const docustay = new Docustay(process.env.DOCUSTAY_API_KEY);
          const result = await docustay.refundPayment("6f1c1f0e-7a0c-4d1d-9b5e-2f0a7b1c3d4e", {"amountMinor":1,"reason":"string"});
          console.log(result);
      - lang: Python
        label: Python (requests)
        source: |-
          import os, requests

          r = requests.post(
              f"https://app.docustay.app/api/v1/payments/{id}/refund",
              headers={"Authorization": f"Bearer {os.environ['DOCUSTAY_API_KEY']}", "Idempotency-Key": __import__("uuid").uuid4().hex},
              json={"amountMinor":1,"reason":"string"},
          )
          r.raise_for_status()
          print(r.json())
