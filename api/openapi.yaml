              headers={"Authorization": f"Bearer {os.environ['DOCUSTAY_API_KEY']}"},
          )
          r.raise_for_status()
          print(r.json())
  /api/v1/documents/send:
    post:
      description: "Makes a document from the template, puts each person on their\
        \ seat and sends it. Needs an `Idempotency-Key` header (8–200 characters):\
        \ a retry with the same key and body does not send again."
      operationId: sendDocument
      parameters:
      - description: "A unique value for this request (8–200 characters, for example\
          \ a UUID). Repeating the request with the same key and body returns the\
          \ first answer instead of doing it twice."
        explode: false
        in: header
        name: Idempotency-Key
        required: true
        schema:
          maxLength: 200
          minLength: 8
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sendDocument_201_response'
          description: Sent.
          headers:
            Docustay-Version:
              $ref: '#/components/headers/Docustay-Version'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
        "400":
          content:
            application/json:
              example:
                error:
                  kind: validation
                  message: "parties[0].email is not a valid address"
                  retryable: false
