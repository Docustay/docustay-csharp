          description: "The sealed PDF, with its certificate."
          headers:
            Docustay-Version:
              $ref: '#/components/headers/Docustay-Version'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
